{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Variant</title>
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/add_variant.css' %}">
</head>

<body>

<div class="add-glaze-page">

    <div class="add-glaze-card">

        <div class="detail-top">
            <a href="{% url 'glaze_detail' glaze.id %}" class="back-button">
                Back to {{ glaze.name }}
            </a>
        </div>

        <h1>Add Variant</h1>

        <p class="page-description">
            Add a variant for <strong>{{ glaze.name }}</strong>. This is where color and additives belong.
        </p>

        <form method="post" class="glaze-form">
            {% csrf_token %}

            <section class="form-section">
                <h2>Variant Information</h2>

                <p>
                    <label for="{{ form.name.id_for_label }}">Variant Name</label>
                    {{ form.name }}
                </p>

                <p>
                    <label for="{{ form.color.id_for_label }}">Color</label>
                    {{ form.color }}
                </p>

                <p>
                    <label for="{{ form.notes.id_for_label }}">Notes</label>
                    {{ form.notes }}
                </p>
            </section>


            <section class="form-section ingredients-section">

                <div class="section-heading-row">
                    <h2>Additives</h2>

                    <button type="button" class="small-add-button" onclick="addAdditiveRow()">
                        Add Additive
                    </button>
                </div>

                <div id="additive-list">

                    <div class="ingredient-entry">
                        <input
                            type="text"
                            name="additive_name"
                            placeholder="Additive name"
                        >

                        <input
                            type="text"
                            name="additive_amount"
                            placeholder="Amount"
                        >

                        <button
                            type="button"
                            class="remove-ingredient-button"
                            onclick="removeAdditiveRow(this)"
                        >
                            Remove
                        </button>
                    </div>

                </div>

            </section>


            <div class="form-actions">
                <button type="submit">Save Variant</button>

                <a href="{% url 'glaze_detail' glaze.id %}" class="back-button">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>


<script>
    function addAdditiveRow() {
        const additiveList = document.getElementById("additive-list");

        const newRow = document.createElement("div");
        newRow.classList.add("ingredient-entry");

        newRow.innerHTML = `
            <input
                type="text"
                name="additive_name"
                placeholder="Additive name"
            >

            <input
                type="text"
                name="additive_amount"
                placeholder="Amount"
            >

            <button
                type="button"
                class="remove-ingredient-button"
                onclick="removeAdditiveRow(this)"
            >
                Remove
            </button>
        `;

        additiveList.appendChild(newRow);
    }

    function removeAdditiveRow(button) {
        const row = button.parentElement;
        const additiveList = document.getElementById("additive-list");

        if (additiveList.children.length > 1) {
            row.remove();
        } else {
            row.querySelectorAll("input").forEach(input => input.value = "");
        }
    }
</script>

</body>
</html>
