{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Add Glaze</title>
    <link rel="stylesheet" href="{% static 'core/main.css' %}">
</head>

<body>

    <div class="page-layout">

        <main class="database-area">

            <h1>Add Glaze</h1>
            <p class="page-description">
                Add a new glaze base to the database.
            </p>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="ingredients-section">
                    <h2>Ingredients</h2>

                    <div class="ingredient-entry">
                        <label>Ingredient:</label>
                        <input type="text" id="ingredient-name">

                        <label>Amount:</label>
                        <input type="number" step="0.01" id="ingredient-amount">

                        <button type="button" onclick="addIngredient()">Add Ingredient</button>
                    </div>

                    <div id="ingredient-list"></div>

                    <div class="ingredient-total-row">
                        <strong>Total:</strong>
                        <span id="ingredient-total">0.00</span>
                    </div>
                    

                </div>

                <br>
                <br>

                <div class="form-actions">
                    <button type="submit">Save Glaze</button>
                    <a href="{% url 'index' %}" class="back-button">Back to Database</a>
                    </div>
            </form>
        </main>

    </div>
<script>
function updateIngredientTotal() {
    const amountInputs = document.querySelectorAll(".ingredient-amount-hidden");
    let total = 0;

    amountInputs.forEach(function(input) {
        total += parseFloat(input.value) || 0;
    });

    document.getElementById("ingredient-total").textContent = total.toFixed(2);
}

function addIngredient() {
    const nameInput = document.getElementById("ingredient-name");
    const amountInput = document.getElementById("ingredient-amount");
    const list = document.getElementById("ingredient-list");

    const name = nameInput.value.trim();
    const amount = amountInput.value.trim();

    if (!name || !amount) {
        return;
    }

    const row = document.createElement("div");
    row.className = "ingredient-row";

    const text = document.createElement("span");
    text.textContent = `${name} - ${amount}`;

    const hiddenName = document.createElement("input");
    hiddenName.type = "hidden";
    hiddenName.name = "ingredient_names";
    hiddenName.value = name;

    const hiddenAmount = document.createElement("input");
    hiddenAmount.type = "hidden";
    hiddenAmount.name = "ingredient_amounts";
    hiddenAmount.value = amount;
    hiddenAmount.className = "ingredient-amount-hidden";

    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.textContent = "Remove";
    removeButton.className = "remove-ingredient-button";

    removeButton.addEventListener("click", function () {
        row.remove();
        updateIngredientTotal();
    });

    row.appendChild(text);
    row.appendChild(hiddenName);
    row.appendChild(hiddenAmount);
    row.appendChild(removeButton);

    list.appendChild(row);

    nameInput.value = "";
    amountInput.value = "";

    updateIngredientTotal();
}
</script>
</body>
</html>
