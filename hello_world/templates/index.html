{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Glaze Database Test</title>
</head>
<body>
    <h1>Page is working</h1>

    <p>If you can see this, Django is loading index.html correctly.</p>

    <h2>Glazes:</h2>

    {% for glaze in glaze_bases %}
        <p>{{ glaze.name }}</p>
    {% empty %}
        <p>No glazes were sent from views.py.</p>
    {% endfor %}
</body>
</html>
